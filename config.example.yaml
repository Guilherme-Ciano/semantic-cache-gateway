server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s
  rate_limit_rps: 10
  rate_limit_burst: 20

cache:
  similarity_threshold: 0.92
  ttl: 24h
  max_candidates: 5

embedder:
  provider: openai
  model: text-embedding-3-small
  api_key: ""        # SCG_EMBEDDER_API_KEY
  base_url: ""

llm:
  provider: openai   # openai | passthrough
  model: gpt-4o-mini
  api_key: ""        # SCG_LLM_API_KEY
  base_url: ""
  upstream_url: ""   # passthrough only

vector_db:
  provider: redis-stack   # redis-stack (primary) | qdrant | redis (legacy scan)
  qdrant_host: localhost
  qdrant_port: 6334
  qdrant_collection: rag_cache
  qdrant_api_key: ""
  redis_addr: localhost:6379
  redis_password: ""
  redis_db: 0
  redis_index: rag_cache_idx
  vector_dimension: 1536

circuit_breaker:
  llm:
    max_requests: 3        # half-open probe window
    interval: 60s          # closed-state rolling window
    timeout: 30s           # open-state wait before probing
    failure_threshold: 5   # consecutive failures before open
  vector_db:
    max_requests: 2
    interval: 30s
    timeout: 10s
    failure_threshold: 3

telemetry:
  log_level: info    # debug | info | warn | error
  metrics_addr: ":9090"
