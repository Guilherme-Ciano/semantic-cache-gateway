version: '2'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - noctx
    - exhaustive
    - gocritic
    - prealloc
    - exportloopref
    - godot

linters-settings:
  goimports:
    local-prefixes: github.com/Guilherme-Ciano/semantic-cache-gateway

  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck

  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - commentedOutCode

  godot:
    scope: declarations
    capital: true

issues:
  exclude-rules:
    # Test files are exempt from some style rules.
    - path: _test\.go
      linters:
        - errcheck
        - godot

  max-issues-per-linter: 0
  max-same-issues: 0
