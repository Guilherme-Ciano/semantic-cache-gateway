services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scg-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      LOG_LEVEL: "info"
      CACHE_SIMILARITY_THRESHOLD: "0.92"
      CACHE_TTL: "24h"
      VECTORDB_PROVIDER: "qdrant"
      QDRANT_HOST: "qdrant"
      QDRANT_COLLECTION: "rag_cache"
      EMBEDDER_PROVIDER: "openai"
      EMBEDDER_MODEL: "text-embedding-3-small"
      EMBEDDER_API_KEY: "${OPENAI_API_KEY}"
      LLM_PROVIDER: "openai"
      LLM_MODEL: "gpt-4o-mini"
      LLM_API_KEY: "${OPENAI_API_KEY}"
      VECTOR_DIMENSION: "1536"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - scg-net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: scg-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - scg-net

volumes:
  qdrant-data:
    driver: local

networks:
  scg-net:
    driver: bridge
