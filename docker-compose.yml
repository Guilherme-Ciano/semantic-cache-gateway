name: semantic-cache-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: semantic-cache-gateway:latest
    container_name: scg-gateway
    restart: unless-stopped
    depends_on:
      redis-stack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SCG_SERVER_ADDR: ":8080"
      SCG_VECTORDB_PROVIDER: "redis-stack"
      SCG_VECTOR_DB_REDIS_ADDR: "redis-stack:6379"
      SCG_VECTOR_DB_REDIS_INDEX: "rag_cache_idx"
      SCG_VECTOR_DB_VECTOR_DIMENSION: "1536"
      SCG_TELEMETRY_LOG_LEVEL: "info"
      # Secrets — supply at runtime or via .env file:
      # SCG_LLM_API_KEY: ""
      # SCG_EMBEDDER_API_KEY: ""
    volumes:
      - ./config.example.yaml:/app/config.yaml:ro
    command: ["/app/gateway", "--config", "/app/config.yaml"]
    networks:
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: scg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: "--save 60 1 --loglevel warning"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: scg-prometheus
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  # internal: gateway ↔ redis-stack — isolated from external traffic.
  internal:
    driver: bridge
    internal: true
  # monitoring: prometheus ↔ gateway — separate plane for observability traffic.
  monitoring:
    driver: bridge
